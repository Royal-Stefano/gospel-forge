name: Gospel Forge RSS Sync

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Podcast RSS Synchronization
        run: |
          curl -X POST "${{ secrets.GOSPEL_FORGE_URL }}/api/cron/rss-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error
